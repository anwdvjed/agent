[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids"
version = "0.1.0"
description = "Network intrusion detection system design project"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ml = ["scikit-learn>=1.3,<2"]
live = ["scapy>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ids*"]

[project.scripts]
ids = "ids.cli:main"
