[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-astra"
version = "0.4.0"
description = "Recurrent temporal graph risk forecasting with bounded risk episode memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
datasets = ["pyarrow>=15,<24"]

[project.scripts]
agent-astra = "agent_astra.cli:main"
agent1 = "agent1.cli:main"

[tool.setuptools.packages.find]
include = ["agent1*", "agent_astra*"]

[tool.setuptools.package-data]
agent1 = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
